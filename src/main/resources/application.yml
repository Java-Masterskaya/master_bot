server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: master-bot
  main:
    log-startup-info: false
    banner-mode: off
  output:
    ansi:
      enabled: never

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${app.db.url}
    username: ${app.db.username}
    password: ${app.db.password}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Настройки Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# Настройки springdoc-openapi
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  structured:
    format:
      console: logstash
  level:
    org:
      springframework: info

app:
  db:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/master-bot?currentSchema=db}
    username: ${DB_USER:dbuser}
    password: ${DB_PASSWORD:}
  admin:
    token: ${ADMIN_TOKEN:}
  intake:
    token: ${INTAKE_TOKEN:}
  nats:
    url: ${NATS_URL:nats://localhost:4222}
  channels:
    telegram:
      enabled: ${TELEGRAM_ENABLED:false}
      token: ${TELEGRAM_TOKEN:}
      mode: ${TELEGRAM_MODE:polling}
    yandex360:
      enabled: ${YANDEX360_ENABLED:false}
      base-url: ${YANDEX360_URL:https://botapi.messenger.yandex.net/bot/v1}
      token: ${YANDEX360_TOKEN:}
      mode: ${YANDEX360_MODE:polling}
  managers-chat:
    channel: ${MANAGERS_CHAT_CHANNEL:yandex360}
    chat-id: ${MANAGERS_CHAT_ID:}
  evaluation:
    enabled: ${EVALUATION_ENABLED:false}
