volumes:
  master_bot_db_data:

services:

  db:
    image: postgres:16.1
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=master-bot
      - POSTGRES_USER=dbuser
      - POSTGRES_PASSWORD=12345
    volumes:
      - master_bot_db_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10

  evaluator:
    build: ./evaluator
    environment:
      KODIK_API_KEY: ${KODIK_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
