name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and check
        run: ./gradlew clean check

      - name: Build Docker image (no push)
        run: |
          if [ -f Dockerfile ]; then
            docker build -t ci-local-check:${{ github.sha }} .
          else
            echo "Dockerfile not found, skipping Docker build."
          fi

  evaluator:
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: evaluator
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install evaluator
        run: python -m pip install -r vendor/brief-evaluator/requirements.txt '.[dev]'
      - name: Lint
        run: python -m ruff check
      - name: Run tests
        run: python -m pytest
